<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Informe Detallado — UTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root { --uts-rojo: #8B1A1A; --uts-verde: #6B7D45; --uts-crema: #FAF0DC; }
        body { background: var(--uts-crema); }
        .hero { background: var(--uts-rojo); color: white; padding: 28px 20px; text-align: center; }
        .hero img { width: 55px; background: white; border-radius: 50%; padding: 5px; margin-bottom: 8px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .table thead { background: var(--uts-rojo); color: white; font-size: 0.8rem; }
        .table td { font-size: 0.82rem; }
        .btn-verde  { background: var(--uts-verde); color: white; border: none; }
        .btn-verde:hover  { background: #556035; color: white; }
        .btn-naranja { background: #E8823A; color: white; border: none; }
        .btn-naranja:hover { background: #c46a28; color: white; }
        .filtro-bar { background: white; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
        .nivel-badge { border-radius: 20px; padding: 2px 8px; font-size: 0.72rem; font-weight: 600; }
        .nivel-Superior { background: #d4edda; color: #155724; }
        .nivel-4 { background: #cce5ff; color: #004085; }
        .nivel-3 { background: #fff3cd; color: #856404; }
        .nivel-2 { background: #fde2b8; color: #7a4000; }
        .nivel-1 { background: #f8d7da; color: #721c24; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body>

<div class="hero">
    <img th:src="@{/img/Logo-UTS-1.png}" alt="UTS"/>
    <h5 class="fw-bold mb-0"><i class="bi bi-file-earmark-bar-graph me-2"></i>Informe Detallado de Resultados Saber Pro</h5>
</div>

<div class="container mt-4">

    <div class="filtro-bar no-print d-flex align-items-center gap-3 flex-wrap">
        <span class="fw-600 text-muted small"><i class="bi bi-funnel me-1"></i>Filtrar por programa:</span>
        <form th:action="@{/coordinador/informe-detallado}" method="get" class="d-flex gap-2 flex-wrap align-items-center">
            <select name="programa" class="form-select form-select-sm" style="width:auto;">
                <option value="">— Todos los programas —</option>
                <option th:each="p : ${programas}" th:value="${p}" th:text="${p}"
                        th:selected="${p == programaFiltro}"></option>
            </select>
            <button type="submit" class="btn btn-sm btn-verde">Filtrar</button>
            <a th:href="@{/coordinador/informe-detallado}" class="btn btn-sm btn-outline-secondary">Limpiar</a>
        </form>
    </div>

    <div class="card p-3 mb-3 no-print">
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <button onclick="window.print()" class="btn btn-sm btn-naranja">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
            <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>DOCUMENTO</th>
                        <th>ESTUDIANTE</th>
                        <th>PROGRAMA</th>
                        <th>PUNTAJE GLOBAL</th>
                        <th>NIVEL GLOBAL</th>
                        <th>COM. ESCRITA</th>
                        <th>RAZ. CUANTITATIVO</th>
                        <th>LECT. CRÍTICA</th>
                        <th>INGLÉS</th>
                        <th>FECHA EXAMEN</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${resultados}">
                        <td th:text="${r.estudiante.numeroDocumento}"></td>
                        <td th:text="${r.estudiante.nombreCompleto}"></td>
                        <td th:text="${r.estudiante.programa}"></td>
                        <td><strong th:text="${r.puntajeGlobal}"></strong></td>
                        <td>
                            <span class="nivel-badge"
                                  th:classappend="${r.nivelGlobal == 'Superior'} ? 'nivel-Superior' :
                                                  (${r.nivelGlobal == 'Nivel 4'} ? 'nivel-4' :
                                                  (${r.nivelGlobal == 'Nivel 3'} ? 'nivel-3' :
                                                  (${r.nivelGlobal == 'Nivel 2'} ? 'nivel-2' : 'nivel-1')))"
                                  th:text="${r.nivelGlobal}"></span>
                        </td>
                        <td th:text="${r.comunicacionEscrita + ' (' + r.comunicacionEscritaNivel + ')'}"></td>
                        <td th:text="${r.razonamientoCuantitativo + ' (' + r.razonamientoCuantitativoNivel + ')'}"></td>
                        <td th:text="${r.lecturaCritica + ' (' + r.lecturaCriticaNivel + ')'}"></td>
                        <td th:text="${r.ingles + ' (' + r.inglesNivel + ')'}"></td>
                        <td th:text="${r.fechaExamen}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="10" class="text-center text-muted py-4">No hay resultados registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
