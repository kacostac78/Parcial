<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Informe General — UTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root { --uts-rojo: #8B1A1A; --uts-verde: #6B7D45; --uts-crema: #FAF0DC; }
        body { background: var(--uts-crema); }
        .hero { background: var(--uts-rojo); color: white; padding: 30px 20px; text-align: center; }
        .hero img { width: 60px; background: white; border-radius: 50%; padding: 5px; margin-bottom: 10px; }
        .hero h4 { font-weight: 700; margin: 0; }
        .hero .meta { font-size: 0.85rem; opacity: 0.85; margin-top: 6px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .table thead { background: var(--uts-rojo); color: white; }
        .badge-activo   { background: #d4edda; color: #155724; border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; }
        .badge-inactivo { background: #f8d7da; color: #721c24; border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; }
        .btn-verde  { background: var(--uts-verde); color: white; border: none; }
        .btn-verde:hover  { background: #556035; color: white; }
        .btn-naranja { background: #E8823A; color: white; border: none; }
        .btn-naranja:hover { background: #c46a28; color: white; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body>

<div class="hero no-print">
    <img th:src="@{/img/Logo-UTS-1.png}" alt="UTS"/>
    <h4><i class="bi bi-file-text me-2"></i>Informe General de Alumnos</h4>
    <div class="meta">
        <i class="bi bi-person me-1"></i>Coordinador:
        <strong th:text="${coordinador?.nombreCompleto ?: 'N/A'}"></strong>
        &nbsp;|&nbsp;
        <i class="bi bi-building me-1"></i>Área:
        <strong th:text="${coordinador?.area ?: 'N/A'}"></strong>
        &nbsp;|&nbsp;
        <i class="bi bi-calendar me-1"></i>
        <strong th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></strong>
    </div>
</div>

<div class="container mt-4">
    <div class="card p-3 mb-3 no-print">
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <button onclick="window.print()" class="btn btn-naranja">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Volver al Panel
            </a>
        </div>
    </div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle table-sm">
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>DOCUMENTO</th>
                        <th>NOMBRE COMPLETO</th>
                        <th>PROGRAMA</th>
                        <th>SEMESTRE</th>
                        <th>Nº REGISTRO</th>
                        <th>CORREO</th>
                        <th>ESTADO</th>
                        <th>RESULTADOS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e, i : ${estudiantes}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${e.numeroDocumento}"></td>
                        <td th:text="${e.nombreCompleto}"></td>
                        <td th:text="${e.programa}"></td>
                        <td th:text="${e.semestre}"></td>
                        <td th:text="${e.numeroRegistro}"></td>
                        <td th:text="${e.correo}"></td>
                        <td>
                            <span th:if="${e.activo}" class="badge-activo">Activo</span>
                            <span th:unless="${e.activo}" class="badge-inactivo">Inactivo</span>
                        </td>
                        <td>
                            <span th:with="count=${resultados.?[estudiante.id == __${e.id}__].size()}"
                                  th:text="${count}">0</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(estudiantes)}">
                        <td colspan="9" class="text-center text-muted py-4">No hay estudiantes registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
