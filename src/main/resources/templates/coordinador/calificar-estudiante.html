<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Calificar Estudiante — UTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root { --uts-rojo: #8B1A1A; --uts-verde: #6B7D45; --uts-crema: #FAF0DC; }
        body { background: var(--uts-crema); }
        .navbar { background-color: var(--uts-rojo) !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .section-title { color: var(--uts-rojo); font-weight: 700; border-bottom: 2px solid var(--uts-rojo); padding-bottom: 6px; margin-bottom: 20px; }
        .form-label { color: var(--uts-rojo); font-weight: 600; font-size: 0.85rem; }
        .form-control:focus, .form-select:focus { border-color: var(--uts-rojo); box-shadow: 0 0 0 .2rem rgba(139,26,26,.2); }
        .info-est { background: white; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; border-left: 4px solid var(--uts-rojo); }
        .info-est h6 { color: var(--uts-rojo); font-weight: 700; margin-bottom: 4px; }
        .btn-guardar { background: var(--uts-verde); color: white; border: none; padding: 10px 30px; border-radius: 8px; font-weight: 600; }
        .btn-guardar:hover { background: #556035; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-3">
    <div class="d-flex align-items-center gap-2">
        <img th:src="@{/img/Logo-UTS-1.png}" height="36" style="background:white;border-radius:6px;padding:3px;" alt="UTS"/>
        <span class="navbar-brand fw-bold mb-0"><i class="bi bi-star me-1"></i>Registrar Resultado Saber Pro</span>
    </div>
    <a th:href="@{/coordinador/estudiantes}" class="btn btn-sm btn-outline-light">
        <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
</nav>

<div class="container mt-4" style="max-width:860px">

    <div class="info-est" th:if="${estudiante}">
        <h6><i class="bi bi-person-circle me-1"></i>Estudiante</h6>
        <div class="row">
            <div class="col-md-6"><strong th:text="${estudiante.nombreCompleto}"></strong></div>
            <div class="col-md-3 text-muted small" th:text="${estudiante.programa}"></div>
            <div class="col-md-3 text-muted small">Semestre <span th:text="${estudiante.semestre}"></span></div>
        </div>
    </div>

    <div class="card p-4">
        <h5 class="section-title"><i class="bi bi-clipboard-data me-2"></i>Puntajes por Competencia</h5>
        <form th:action="@{'/coordinador/estudiantes/calificar/' + ${estudiante.id}}" method="post">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-trophy me-1"></i>Puntaje Global</label>
                    <input type="number" step="0.01" name="puntajeGlobal" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-calendar me-1"></i>Fecha del Examen</label>
                    <input type="date" name="fechaExamen" class="form-control"/>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-pencil me-1"></i>Comunicación Escrita</label>
                    <input type="number" step="0.01" name="comunicacionEscrita" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Comunicación Escrita</label>
                    <select name="comunicacionEscritaNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-calculator me-1"></i>Razonamiento Cuantitativo</label>
                    <input type="number" step="0.01" name="razonamientoCuantitativo" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Razonamiento Cuantitativo</label>
                    <select name="razonamientoCuantitativoNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-book me-1"></i>Lectura Crítica</label>
                    <input type="number" step="0.01" name="lecturaCritica" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Lectura Crítica</label>
                    <select name="lecturaCriticaNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-people me-1"></i>Competencias Ciudadanas</label>
                    <input type="number" step="0.01" name="competenciasCiudadanas" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Competencias Ciudadanas</label>
                    <select name="competenciasCiudadanasNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-translate me-1"></i>Inglés</label>
                    <input type="number" step="0.01" name="ingles" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Inglés</label>
                    <select name="inglesNivel" class="form-select">
                        <option>A0</option><option>A1</option><option>A2</option>
                        <option>B1</option><option>B2</option><option>C1</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-lightbulb me-1"></i>Formulación de Proyectos</label>
                    <input type="number" step="0.01" name="formulacionProyectos" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Formulación de Proyectos</label>
                    <select name="formulacionProyectosNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-graph-up me-1"></i>Pensamiento Científico</label>
                    <input type="number" step="0.01" name="pensamientoCientifico" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Pensamiento Científico</label>
                    <select name="pensamientoCientificoNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-code-slash me-1"></i>Diseño de Software</label>
                    <input type="number" step="0.01" name="disenoSoftware" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nivel Diseño de Software</label>
                    <select name="disenoSoftwareNivel" class="form-select">
                        <option>Nivel 1</option><option>Nivel 2</option>
                        <option>Nivel 3</option><option>Nivel 4</option><option>Superior</option>
                    </select>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-guardar px-5">
                    <i class="bi bi-save me-2"></i>Guardar Resultado
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
