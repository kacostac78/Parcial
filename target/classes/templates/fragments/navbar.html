<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>

<nav th:fragment="navbar(titulo, rol)" class="navbar navbar-expand-lg navbar-dark"
     style="background-color: #8B1A1A;">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <img th:src="@{/img/Logo-UTS-1.png}" height="36"
                 style="background:white; border-radius:6px; padding:3px;" alt="UTS"/>
            <span class="fw-bold" th:text="${titulo}">Saber Pro</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>
                Bienvenido, <strong class="text-white" sec:authentication="name">usuario</strong>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</nav>

</body>
