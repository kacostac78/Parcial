<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Informe de Beneficios — UTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root { --uts-rojo: #8B1A1A; --uts-verde: #6B7D45; --uts-crema: #FAF0DC; }
        body { background: var(--uts-crema); }
        .hero { background: var(--uts-verde); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .hero img { width: 60px; background: white; border-radius: 50%; padding: 5px; margin-bottom: 8px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .table thead { background: var(--uts-verde); color: white; }
        .btn-verde  { background: var(--uts-verde); color: white; border: none; }
        .btn-verde:hover { background: #556035; color: white; }
        .beneficio-txt { font-size: 0.78rem; background: #e8f5e9; color: #1b5e20; border-radius: 6px; padding: 3px 8px; }
        .nivel-badge { border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; font-weight: 600; }
        .nivel-Superior { background: #d4edda; color: #155724; }
        .nivel-4 { background: #cce5ff; color: #004085; }
        .nivel-3 { background: #fff3cd; color: #856404; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body>

<div class="hero">
    <img th:src="@{/img/Logo-UTS-1.png}" alt="UTS"/>
    <h4><i class="bi bi-trophy me-2"></i>Informe de Beneficios</h4>
    <p class="mb-0 small">Estudiantes con Exoneración y Becas — Saber Pro</p>
</div>

<div class="container mt-4">

    <div class="card p-3 mb-3 no-print">
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver al Panel
            </a>
            <button onclick="window.print()" class="btn btn-verde btn-sm">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
        </div>
    </div>

    <div class="card p-4">
        <h6 class="mb-3" style="color:var(--uts-verde); font-weight:700;">
            <i class="bi bi-award me-2"></i>Estudiantes con Exoneración de Trabajo de Grado
        </h6>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th><i class="bi bi-card-text me-1"></i>DOCUMENTO</th>
                        <th><i class="bi bi-person me-1"></i>NOMBRE COMPLETO</th>
                        <th><i class="bi bi-mortarboard me-1"></i>PROGRAMA</th>
                        <th><i class="bi bi-trophy me-1"></i>PUNTAJE GLOBAL</th>
                        <th><i class="bi bi-bar-chart me-1"></i>NIVEL</th>
                        <th><i class="bi bi-gift me-1"></i>BENEFICIO</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r, i : ${resultados}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${r.estudiante.numeroDocumento}"></td>
                        <td th:text="${r.estudiante.nombreCompleto}"></td>
                        <td th:text="${r.estudiante.programa}"></td>
                        <td><strong th:text="${r.puntajeGlobal}"></strong></td>
                        <td>
                            <span class="nivel-badge"
                                  th:classappend="${r.nivelGlobal == 'Superior'} ? 'nivel-Superior' :
                                                  (${r.nivelGlobal == 'Nivel 4'} ? 'nivel-4' : 'nivel-3')"
                                  th:text="${r.nivelGlobal}"></span>
                        </td>
                        <td>
                            <span class="beneficio-txt"
                                  th:text="${T(com.saberpro.app.util.BeneficioUtil).calcularBeneficio(r.puntajeGlobal)}">
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox me-2"></i>No hay estudiantes con beneficios registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
