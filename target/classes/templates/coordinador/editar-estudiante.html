<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Editar Estudiante — UTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root { --uts-rojo: #8B1A1A; --uts-verde: #6B7D45; --uts-crema: #FAF0DC; }
        body { background: var(--uts-crema); }
        .navbar { background-color: var(--uts-rojo) !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 700px; margin: 30px auto; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; background: #E8823A; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .avatar i { font-size: 2rem; color: white; }
        .lbl { background: var(--uts-rojo); color: white; border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
        .form-control:focus, .form-select:focus { border-color: var(--uts-rojo); box-shadow: 0 0 0 .2rem rgba(139,26,26,.2); }
        .form-control[readonly] { background: #f5f5f5; }
        .btn-actualizar { background: #E8823A; color: white; border: none; padding: 10px 30px; border-radius: 8px; font-weight: 600; }
        .btn-actualizar:hover { background: #c46a28; color: white; }
        .btn-cancelar { background: white; color: #666; border: 1px solid #ccc; padding: 10px 30px; border-radius: 8px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-3">
    <div class="d-flex align-items-center gap-2">
        <img th:src="@{/img/Logo-UTS-1.png}" height="36" style="background:white;border-radius:6px;padding:3px;" alt="UTS"/>
        <span class="navbar-brand fw-bold mb-0"><i class="bi bi-pencil-square me-1"></i>Editar Estudiante</span>
    </div>
</nav>

<div class="container">
    <div class="card p-4" th:if="${estudiante}">
        <div class="text-center mb-3">
            <div class="avatar"><i class="bi bi-person-graduation"></i></div>
        </div>

        <form th:action="@{'/coordinador/estudiantes/editar/' + ${estudiante.id}}" method="post">
            <div class="row g-3 align-items-center">
                <div class="col-4"><span class="lbl"><i class="bi bi-card-text me-1"></i>Documento</span></div>
                <div class="col-8"><input type="text" class="form-control" th:value="${estudiante.numeroDocumento}" readonly/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-person me-1"></i>Primer Nombre</span></div>
                <div class="col-8"><input type="text" name="primerNombre" class="form-control" th:value="${estudiante.primerNombre}" required/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-person me-1"></i>Segundo Nombre</span></div>
                <div class="col-8"><input type="text" name="segundoNombre" class="form-control" th:value="${estudiante.segundoNombre}"/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-person me-1"></i>Primer Apellido</span></div>
                <div class="col-8"><input type="text" name="primerApellido" class="form-control" th:value="${estudiante.primerApellido}" required/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-person me-1"></i>Segundo Apellido</span></div>
                <div class="col-8"><input type="text" name="segundoApellido" class="form-control" th:value="${estudiante.segundoApellido}"/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-envelope me-1"></i>Correo</span></div>
                <div class="col-8"><input type="email" name="correo" class="form-control" th:value="${estudiante.correo}" required/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-telephone me-1"></i>Teléfono</span></div>
                <div class="col-8"><input type="text" name="telefono" class="form-control" th:value="${estudiante.telefono}"/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-card-checklist me-1"></i>Nº Registro</span></div>
                <div class="col-8"><input type="text" name="numeroRegistro" class="form-control" th:value="${estudiante.numeroRegistro}"/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-calendar me-1"></i>Semestre</span></div>
                <div class="col-8"><input type="number" name="semestre" class="form-control" th:value="${estudiante.semestre}" min="1" max="12"/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-mortarboard me-1"></i>Programa</span></div>
                <div class="col-8"><input type="text" name="programa" class="form-control" th:value="${estudiante.programa}"/></div>

                <div class="col-4"><span class="lbl"><i class="bi bi-award me-1"></i>Tipo Programa</span></div>
                <div class="col-8">
                    <select name="tipoPrograma" class="form-select">
                        <option value="Profesional"  th:selected="${estudiante.tipoPrograma == 'Profesional'}">Profesional</option>
                        <option value="Tecnológico"  th:selected="${estudiante.tipoPrograma == 'Tecnológico'}">Tecnológico</option>
                        <option value="Técnico"      th:selected="${estudiante.tipoPrograma == 'Técnico'}">Técnico</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a th:href="@{/coordinador/estudiantes}" class="btn btn-cancelar">
                    <i class="bi bi-x me-1"></i>Cancelar
                </a>
                <button type="submit" class="btn btn-actualizar">
                    <i class="bi bi-save me-1"></i>Actualizar Estudiante
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
